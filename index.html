<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search KDP Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="word%20game%20logo.png">
    <!-- jsPDF for PDF Export (native vector rendering, no html2canvas needed) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="layout-container">
        <!-- Sidebar Settings -->
        <aside class="settings-panel">
            <h1>Word Search Studio</h1>
            
            <section class="setting-group">
                <h2>0. Language</h2>
                <label>Puzzle Language</label>
                <select id="puzzle-language">
                    <option value="en">🇬🇧 English</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="de">🇩🇪 Deutsch</option>
                </select>
            </section>

            <section class="setting-group">
                <h2>1. Words &amp; Data</h2>
                <label>Puzzle Title <small style="color:#999;font-weight:normal;">(enter a space " " to hide)</small></label>
                <input type="text" id="puzzle-title" value="" placeholder="Auto-set by language (editable)">
                
                <label>Upload CSV (Clues)</label>
                <input type="file" id="csv-upload" accept=".csv">
                
                <label>Or Enter Words Manually (one per line)</label>
                <textarea id="word-list" rows="5">APPLE
BANANA
ORANGE
GRAPE
PEACH</textarea>
                <button id="shuffle-words" class="btn-secondary">Shuffle Words</button>
            </section>
            
            <section class="setting-group">
                <h2>2. Grid Settings</h2>
                <label>Grid Size</label>
                <select id="grid-size-preset">
                    <option value="10x10">10x10 (Kids)</option>
                    <option value="15x15" selected>15x15 (General)</option>
                    <option value="18x18">18x18 (Teen/Adult)</option>
                    <option value="20x20">20x20 (Adult/Hard)</option>
                    <option value="custom">Custom...</option>
                </select>
                <div id="custom-grid-size" style="display: none; gap: 10px; margin-top: 10px;">
                    <input type="number" id="grid-cols" value="15" min="5" max="30" title="Columns"> x 
                    <input type="number" id="grid-rows" value="15" min="5" max="30" title="Rows">
                </div>
                
                <label>Directions</label>
                <div class="directions-grid">
                    <label><input type="checkbox" class="direction-toggle" value="N" checked> N</label>
                    <label><input type="checkbox" class="direction-toggle" value="S" checked> S</label>
                    <label><input type="checkbox" class="direction-toggle" value="E" checked> E</label>
                    <label><input type="checkbox" class="direction-toggle" value="W" checked> W</label>
                    <label><input type="checkbox" class="direction-toggle" value="NE" checked> NE</label>
                    <label><input type="checkbox" class="direction-toggle" value="NW" checked> NW</label>
                    <label><input type="checkbox" class="direction-toggle" value="SE" checked> SE</label>
                    <label><input type="checkbox" class="direction-toggle" value="SW" checked> SW</label>
                </div>
                
                <label style="margin-top: 10px;">
                    <input type="checkbox" id="allow-backwards" checked> Allow Backwards Words
                </label>
            </section>
            
            <section class="setting-group">
                <h2>3. Page Layout</h2>
                <label>Trim Size</label>
                <select id="trim-size">
                    <option value="8.5x11">US Letter (8.5x11")</option>
                    <option value="6x9">KDP (6x9")</option>
                    <option value="8.5x8.5">Square (8.5x8.5")</option>
                    <option value="A4">A4</option>
                </select>

                <!-- Page Margins -->
                <label style="margin-top:12px;">Page Margins</label>
                <select id="page-margin">
                    <option value="0.25">0.25 inch</option>
                    <option value="0.375" selected>0.375 inch</option>
                    <option value="0.5">0.5 inch</option>
                </select>
                
                <label>Clues Placement</label>
                <select id="clue-placement">
                    <option value="bottom">Bottom (Center)</option>
                    <option value="side">Side</option>
                </select>
                
                <div id="clue-count-container" style="margin-top: 10px;">
                    <label>Clues Columns</label>
                    <input type="number" id="clue-cols" value="3" min="1" max="10">
                    
                    <label>Clues Rows</label>
                    <input type="number" id="clue-rows" value="5" min="1" max="20">
                    
                    <label>Clues Spacing (px)</label>
                    <input type="number" id="clue-spacing" value="10" min="0" max="50">
                </div>
            </section>

            <section class="setting-group">
                <h2>4. Fonts</h2>

                <!-- Title Font -->
                <label>Title Font</label>
                <select id="font-title" class="font-picker"></select>
                <div class="font-dropzone" id="font-dropzone-title" data-slot="title">
                    <span class="font-dropzone-icon">🖱 drag &amp; drop</span>
                    <span class="font-dropzone-text" id="font-upload-label-title">Drop a .ttf here or <u>click to browse</u></span>
                    <input type="file" id="font-upload-title" accept=".ttf" style="display:none;">
                    <button class="font-dropzone-clear" id="font-upload-clear-title" title="Clear custom font">✕</button>
                </div>

                <!-- Clues Font -->
                <label>Clues Font</label>
                <select id="font-clues" class="font-picker"></select>
                <div class="font-dropzone" id="font-dropzone-clues" data-slot="clues">
                    <span class="font-dropzone-icon">🖱 drag &amp; drop</span>
                    <span class="font-dropzone-text" id="font-upload-label-clues">Drop a .ttf here or <u>click to browse</u></span>
                    <input type="file" id="font-upload-clues" accept=".ttf" style="display:none;">
                    <button class="font-dropzone-clear" id="font-upload-clear-clues" title="Clear custom font">✕</button>
                </div>

                <!-- Grid Font -->
                <label>Grid Font</label>
                <select id="font-grid" class="font-picker"></select>
                <div class="font-dropzone" id="font-dropzone-grid" data-slot="grid">
                    <span class="font-dropzone-icon">🖱 drag &amp; drop</span>
                    <span class="font-dropzone-text" id="font-upload-label-grid">Drop a .ttf here or <u>click to browse</u></span>
                    <input type="file" id="font-upload-grid" accept=".ttf" style="display:none;">
                    <button class="font-dropzone-clear" id="font-upload-clear-grid" title="Clear custom font">✕</button>
                </div>
            </section>
            
            <section class="setting-group">
                <h2>5. Style</h2>
                <label>Background Pattern Opacity (%)</label>
                <input type="range" id="bg-opacity" min="0" max="100" value="0">
                
                <label style="margin-top: 10px;">
                    <input type="checkbox" id="grid-border" checked> Show Grid Border
                </label>

                <!-- Background design image (puzzle pages only) -->
                <label style="margin-top:14px;">Background Design Image <small style="color:#999;font-weight:normal;">(Puzzle pages only · PNG 300 DPI)</small></label>
                <div class="font-upload-row">
                    <label class="btn-upload" for="bg-image-upload">
                        <span id="bg-image-upload-label">Upload PNG</span>
                        <input type="file" id="bg-image-upload" accept="image/png,image/jpeg,.png,.jpg" style="display:none;">
                    </label>
                    <button id="bg-image-clear" class="btn-upload-clear" title="Clear background image">✕</button>
                </div>
            </section>

            <section class="setting-group">
                <h2>6. Batch &amp; Export</h2>
                
                <label>Words Per Puzzle</label>
                <input type="number" id="words-per-puzzle" value="15" min="5" max="100">
                
                <label>Number of Puzzles to Generate</label>
                <input type="number" id="puzzle-count" value="1" min="1" max="100">
                
                <label>Solutions Per Page</label>
                <select id="solutions-per-page">
                    <option value="1">1</option>
                    <option value="2">2 (1x2)</option>
                    <option value="3">3</option>
                    <option value="4">4 (2x2)</option>
                    <option value="5">5</option>
                    <option value="6" selected>6 (2x3)</option>
                </select>

                <div id="error-message" style="color: red; display: none; margin-top: 10px; font-weight: bold;"></div>

                <button id="generate-btn" class="btn-primary">Generate Preview</button>
                <button id="export-pdf-btn" class="btn-success">Export PDF (All Puzzles)</button>
            </section>

        </aside>

        <!-- Live Preview Area -->
        <main class="preview-panel">
            <div class="preview-toolbar">
                <span>Previewing Puzzle #1</span>
            </div>
            <div class="preview-canvas" id="preview-canvas">
                <!-- Pages injected here -->
            </div>
        </main>
    </div>

    <script src="fonts.js"></script>
    <script src="generator.js"></script>
    <script src="pdf-export.js"></script>
    <script src="app.js"></script>
</body>
</html>
